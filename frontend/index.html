<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCIM Platform</title>
    <script>
      // Set the theme before first paint so a reload never flashes the wrong one. Same order as
      // src/lib/theme.ts: stored choice, then the system setting, then Normal (light).
      (function () {
        var theme = null;
        try { theme = window.localStorage.getItem("dcim-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="bg-surface-page text-fg-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
