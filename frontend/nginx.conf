server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Datasheet PDF uploads (POST /catalog/documents and /catalog/revisions/{id}/documents).
    # nginx's 1 MB default would reject them before the API applies its own configurable cap
    # (CATALOG_DOCUMENT_MAX_BYTES, default 25 MB); 26m leaves room for the multipart envelope.
    # Raise this together with that setting. The longer read timeout covers validation and the
    # malware scan.
    location ~ ^/api/v1/catalog/(documents|revisions/[^/]+/documents)$ {
        client_max_body_size 26m;
        proxy_read_timeout 120s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
