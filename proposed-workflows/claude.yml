# proposed-workflows/claude.yml
# DRAFT, NOT ACTIVE, NOT TESTED. Scoped proposal against live .github/workflows/claude.yml.
# Changes vs live: (1) a secret-free `prepare` job gates trusted author_association and
# validates a default-empty exact bot allowlist; (2) the secret-bearing job `needs` it;
# (3) allowed_bots is passed explicitly. Everything else is unchanged.
#
# Variable (optional, owner-set): CLAUDE_ALLOWED_BOTS = comma-separated exact bot logins,
# for example "dependabot[bot]". Unset/empty => no bots. Wildcards, spaces or any
# malformed entry => whole list rejected (fail closed, bots denied, humans still gated).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  prepare:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      allowed_bots: ${{ steps.check.outputs.allowed_bots }}
    steps:
      - id: check
        env:
          ASSOCIATION: >-
            ${{ github.event.comment.author_association
                || github.event.review.author_association
                || github.event.issue.author_association }}
          BOTS: ${{ vars.CLAUDE_ALLOWED_BOTS }}
        run: |
          set -euo pipefail
          ASSOCIATION="$(printf '%s' "$ASSOCIATION" | tr -d '[:space:]')"
          trusted=false
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) trusted=true ;; esac

          bots=""
          if [ -n "${BOTS:-}" ]; then
            if printf '%s' "$BOTS" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}\[bot\](,[A-Za-z0-9][A-Za-z0-9-]{0,38}\[bot\])*$'; then
              bots="$BOTS"
            else
              echo "CLAUDE_ALLOWED_BOTS malformed; ignoring (no bots allowed)."
            fi
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          echo "allowed_bots=${bots}" >> "$GITHUB_OUTPUT"

  claude:
    needs: prepare
    if: needs.prepare.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          allowed_bots: ${{ needs.prepare.outputs.allowed_bots }}
          additional_permissions: |
            actions: read
