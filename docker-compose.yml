services:
  # NOTE (PHASE1_IMPLEMENTATION_RED_TEAM_REPORT.md Finding C1 / PHASE1_CORRECTION_REPORT.md):
  # the Postgres bootstrap superuser here is `postgres` (the official image's default
  # when POSTGRES_USER is left unset), NOT `dcim_app`. Previously POSTGRES_USER was set
  # to `dcim_app`, which the official postgres image grants full superuser rights to —
  # silently defeating every least-privilege control in this file, since a superuser
  # bypasses ALL grants/revokes/ownership checks. `dcim_app` is now created as an
  # ordinary, non-superuser role by backend/scripts/docker-initdb/01-create-app-role.sh,
  # matching the non-Docker local setup documented in README.md. This file is a static
  # edit only — see PHASE1_DEVIATIONS.md D1: no Docker daemon is available in the
  # development sandbox this correction was made in, so this has not been runtime-verified
  # with `docker compose up`.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcim}
      DCIM_APP_PASSWORD: ${DCIM_APP_PASSWORD:?set DCIM_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/docker-initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://dcim_app:${DCIM_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dcim}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Runs scripts/bootstrap_privileged_roles.sql as the real Postgres superuser, after
  # migrations have created audit_log — see the note on the `postgres` service above and
  # Finding C1. This must run as `postgres`, never as `dcim_app` (which lacks CREATEROLE
  # and, post-fix, lacks any DDL right over audit_log by design).
  bootstrap-privileges:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-dcim}
    volumes:
      - ./backend/scripts/bootstrap_privileged_roles.sql:/bootstrap_privileged_roles.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap_privileged_roles.sql"]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://dcim_app:${DCIM_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dcim}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-privileges:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://dcim_app:${DCIM_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dcim}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-privileges:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.infrastructure.celery_app", "worker", "--loglevel=info", "-Q", "default,maintenance"]

  celery-beat:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://dcim_app:${DCIM_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dcim}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-privileges:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.infrastructure.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
