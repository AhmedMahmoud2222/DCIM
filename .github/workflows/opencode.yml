# OpenCode implementation agent (workflow v2.0).
# Authority model and token rationale: docs/security/OPENCODE_AGENT_AUTHORITY.md
name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# No ambient authority. Each job declares the minimum it needs.
permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Job 1: decide, with no credentials beyond a read-only token. Untrusted comment text is read from the
  # event file by a script on the default branch and never interpolated into shell.
  gate:
    name: Authorize command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      task: ${{ steps.gate.outputs.task }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
    steps:
      - name: Checkout gate script from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Fetch PR metadata for PR conversation comments
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > "${RUNNER_TEMP}/pr.json"
      - name: Authorize
        id: gate
        env:
          ALLOWED_ACTOR_IDS: ${{ vars.OPENCODE_ALLOWED_ACTOR_IDS }}
          PR_JSON_PATH: ${{ runner.temp }}/pr.json
        run: python3 .github/scripts/opencode_gate.py

  # Job 2: only reached after the gate passes. Secrets live in the protected
  # `opencode-agent` environment, so an unauthorized run never receives them.
  opencode:
    name: Run OpenCode
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: opencode-agent
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run OpenCode
        uses: dceoy/opencode-action@163f9a9cd3d3f497e2847635585419f951371d2f  # v0.8.1
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode-go/kimi-k3
          use-github-token: 'true'
          prompt: ${{ needs.gate.outputs.task }}
          timeout-minutes: '30'
      - name: Require verified signatures on published commits
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_REF: ${{ needs.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          refs=()
          if [[ -n "${PR_HEAD_REF}" ]]; then refs+=("${PR_HEAD_REF}"); fi
          while read -r ref; do
            if [[ -n "${ref}" ]]; then refs+=("${ref#refs/heads/}"); fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/opencode/" --jq '.[].ref')
          if [[ "${#refs[@]}" -eq 0 ]]; then echo "No branches to verify."; exit 0; fi
          python3 .github/scripts/opencode_verify_signatures.py "${GITHUB_REPOSITORY}" "${DEFAULT_BRANCH}" "${refs[@]}"
