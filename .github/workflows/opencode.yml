# OpenCode implementation agent (workflow v3.0).
# Design, permissions, setup and recovery: docs/security/OPENCODE_AGENT_AUTHORITY.md
#
# Trigger scope: issue_comment only. GitHub runs issue_comment workflows from the
# default branch. pull_request_review_comment runs the workflow file from the PR merge
# ref, so a PR author could edit this file and trigger it; that event is not supported.
#
# Flow: gate (no secrets) -> opencode (agent, read-only repo token, no publish rights)
#       -> publish (fresh runner, dedicated GitHub App token, GitHub-signed commit).
name: OpenCode

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      task: ${{ steps.gate.outputs.task }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
    steps:
      # github.sha is the default-branch commit this workflow file came from, so the
      # scripts below always match the workflow. If a merge ever lands the workflow
      # without them, the gate step fails and the agent never starts.
      - name: Checkout scripts from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Fetch PR metadata for PR conversation comments
        if: github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > "${RUNNER_TEMP}/pr.json"
      - name: Authorize
        id: gate
        env:
          ALLOWED_ACTOR_IDS: ${{ vars.OPENCODE_ALLOWED_ACTOR_IDS }}
          PR_JSON_PATH: ${{ runner.temp }}/pr.json
        run: |
          test -f .github/scripts/opencode_gate.py || { echo "::error::gate script missing on this commit; refusing to run"; exit 1; }
          python3 .github/scripts/opencode_gate.py

  opencode:
    name: Run OpenCode (no publish rights)
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: opencode-agent
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.collect.outputs.has_changes }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      model: ${{ steps.route.outputs.model }}
      category: ${{ steps.route.outputs.category }}
      reason: ${{ steps.route.outputs.reason }}
      agent_outcome: ${{ steps.agent.outcome }}
    steps:
      - name: Checkout default branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read live model catalog
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
                 https://opencode.ai/zen/v1/models -o "${RUNNER_TEMP}/available.json"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not read the OpenCode model catalog after 3 attempts; stopping before any model call"
          exit 1
      - name: Select model
        id: route
        env:
          TASK: ${{ needs.gate.outputs.task }}
        run: python3 .github/scripts/opencode_router.py --registry .github/opencode/model-registry.json --available "${RUNNER_TEMP}/available.json"
      - name: Record base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ needs.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_HEAD_REF}" ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${PR_HEAD_REF}" --jq .commit.sha)"
          else
            sha="$(git rev-parse HEAD)"
          fi
          echo "base_sha=${sha}" >> "${GITHUB_OUTPUT}"
      - name: Run OpenCode
        id: agent
        continue-on-error: true
        uses: dceoy/opencode-action@163f9a9cd3d3f497e2847635585419f951371d2f  # v0.8.1
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow"}}}'
        with:
          model: ${{ steps.route.outputs.model }}
          use-github-token: 'true'
          prompt: ${{ needs.gate.outputs.task }}
          timeout-minutes: '30'
      - name: Collect changes as data
        id: collect
        if: always() && steps.base.outputs.base_sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/opencode_collect.py "${GITHUB_WORKSPACE}" "${BASE_SHA}" "${RUNNER_TEMP}/changes"
          if [[ "$(jq '.changes | length' "${RUNNER_TEMP}/changes/manifest.json")" -gt 0 ]]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload changes
        if: always() && steps.collect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: opencode-changes
          path: ${{ runner.temp }}/changes
          if-no-files-found: error
          retention-days: 1
      - name: Fail when the agent produced nothing
        if: steps.agent.outcome == 'failure' && steps.collect.outputs.has_changes != 'true'
        run: |
          echo "::error::OpenCode failed and produced no changes"
          exit 1

  publish:
    name: Publish signed commit and Draft PR
    needs: [gate, opencode]
    if: needs.opencode.result == 'success' && needs.opencode.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: opencode-publish
    permissions:
      contents: read
    steps:
      - name: Checkout publisher scripts from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Download changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: opencode-changes
          path: ${{ runner.temp }}/changes
      - name: Mint short-lived App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.OPENCODE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENCODE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Publish
        id: publish
        env:
          GH_PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/changes
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_KIND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
          TARGET_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR_LOGIN: ${{ github.event.comment.user.login }}
          EXPECT_BOT_LOGIN: ${{ vars.OPENCODE_APP_SLUG }}[bot]
          TASK: ${{ needs.gate.outputs.task }}
          MODEL: ${{ needs.opencode.outputs.model }}
          CATEGORY: ${{ needs.opencode.outputs.category }}
          ROUTE_REASON: ${{ needs.opencode.outputs.reason }}
          AGENT_OUTCOME: ${{ needs.opencode.outputs.agent_outcome }}
        run: python3 .github/scripts/opencode_publish.py
      - name: Independently re-verify the published commit
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit }}
          EXPECT_BOT_LOGIN: ${{ vars.OPENCODE_APP_SLUG }}[bot]
        run: python3 .github/scripts/opencode_verify_signatures.py --commit "${GITHUB_REPOSITORY}" "${COMMIT_SHA}" "${EXPECT_BOT_LOGIN}"
