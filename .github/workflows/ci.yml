name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new commit lands. A stale
# Full CI result from an earlier commit can never be presented as the current
# check status for a later commit (safeguard #4).
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Non-secret, shared CI configuration. Production secrets are never stored here.
  POSTGRES_PASSWORD_SUPERUSER: dcim_dev_superuser_password
  JWT_SECRET_KEY: ci-only-secret-key-not-for-production-use-32ch
  CREDENTIAL_ENCRYPTION_KEY: eHTZ8u6qF3v2N1oQwL9pR7sT4yU6iO0aB2cD5eF8gH0=
  ENVIRONMENT: test
  # The real-OCR extraction tests must run here, never silently skip
  # (tests/unit/test_extraction_pipeline.py).
  REQUIRE_REAL_OCR: "1"
  # Expose the repository root so backend contract tests can reach the
  # independently packaged Edge Collector scheduler constants without installing
  # the Edge runtime into the backend distribution.
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # =========================================================================
  # FAST CI — every PR.
  # Change detection and risk classification, linting, security baseline and
  # migration integrity. Deterministic, fail-closed routing.
  # =========================================================================
  fast-ci:
    name: Fast CI (routing, security baseline, migration integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      risk-level: ${{ steps.router.outputs.risk-level }}
      run-full-ci: ${{ steps.router.outputs.run-full-ci }}
      run-edge-collector: ${{ steps.router.outputs.run-edge-collector }}
      run-database-contracts: ${{ steps.router.outputs.run-database-contracts }}
      run-opencode: ${{ steps.router.outputs.run-opencode }}
      detection-failed: ${{ steps.router.outputs.detection-failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install lightweight validation tooling
        run: pip install ruff alembic
      - name: Classify changes and route CI level
        id: router
        run: python .github/scripts/ci_router.py
      - name: Migration integrity (Alembic single-head gate)
        # Reads revision files only — no database — so it fails fast before any
        # migration step runs.
        run: |
          ruff check backend/scripts/check_alembic_single_head.py
          python backend/scripts/check_alembic_single_head.py
      - name: Lint (ruff)
        run: ruff check backend/app backend/tests
      - name: Security baseline (confidential preflight-report guard)
        # .gitignore keeps the preflight report out of normal commits; this
        # guard also fails a force-added/tracked copy.
        working-directory: ${{ github.workspace }}
        run: |
          tracked="$(git ls-files | grep -E '(^|/)sec-arch-02-preflight.*\.json$' || true)"
          stray="$(find . -name 'sec-arch-02-preflight*.json' -not -path './.git/*' -print)"
          if [ -n "$tracked" ]; then
            echo "Confidential preflight report is tracked by git: $tracked" >&2
            exit 1
          fi
          if [ -n "$stray" ]; then
            echo "Confidential preflight report present in the checkout: $stray" >&2
            exit 1
          fi

  # =========================================================================
  # REQUIRED CHECKS — always run, always validate meaningfully (preserved).
  # `backend` consumes Fast CI's routing decision so it can run a fast path for
  # low-risk changes and the full suite for high-risk changes. `if: always()`
  # guarantees it can never be skipped as a side effect of Fast CI
  # (safeguard #2: never "never completed").
  # =========================================================================
  backend:
    name: Backend
    needs: fast-ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dcim_dev_superuser_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ${{ env.JWT_SECRET_KEY }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ env.CREDENTIAL_ENCRYPTION_KEY }}
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:dcim_dev_superuser_password@localhost:5432/dcim_test
      PGPASSWORD_SUPERUSER: dcim_dev_superuser_password
      RISK_LEVEL: ${{ needs.fast-ci.outputs.risk-level }}
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse SEC-ARCH-02 preflight reports in the checkout (issue #175)
        working-directory: ${{ github.workspace }}
        run: |
          tracked="$(git ls-files | grep -E '(^|/)sec-arch-02-preflight.*\.json$' || true)"
          stray="$(find . -name 'sec-arch-02-preflight*.json' -not -path './.git/*' -print)"
          if [ -n "$tracked" ]; then
            echo "Confidential preflight report is tracked by git: $tracked" >&2
            exit 1
          fi
          if [ -n "$stray" ]; then
            echo "Confidential preflight report present in the checkout: $stray" >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Cache Python dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: pip-backend-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            pip-backend-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Select validation depth
        id: depth
        env:
          RISK_LEVEL: ${{ needs.fast-ci.outputs.risk-level }}
        run: |
          if [[ "${RISK_LEVEL}" == "full" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
          fi
      # --- Fast path: low-risk change. Bounded, DB-free validation that keeps
      # the required `backend` check completing in minutes rather than tens of
      # minutes. Fast CI already covers lint and migration integrity at repo
      # level; this path re-asserts them inside the backend job and adds an
      # import smoke test. ---
      - if: steps.depth.outputs.mode == 'fast'
        name: Backend fast validation (low-risk change)
        timeout-minutes: 8
        run: |
          ruff check scripts/check_alembic_single_head.py
          python scripts/check_alembic_single_head.py
          ruff check app tests
          python -c "import app.main; print('backend import smoke OK')"
      # --- Full path: high-risk change. The complete, preserved validation. ---
      - if: steps.depth.outputs.mode == 'full'
        name: Install the OCR engine for the real-OCR extraction tests
        # Not continue-on-error: REQUIRE_REAL_OCR=1 makes the tests fail, not skip, without it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - if: steps.depth.outputs.mode == 'full'
        name: Install clamd for the real-scanner tests
        # tests/integration/test_clamd_real.py runs the production scanner class against a real
        # clamd with a local EICAR signature database, and skips itself when clamd is missing.
        # A package-mirror hiccup must not fail the build, so a failed install only skips them.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam || true
      - if: steps.depth.outputs.mode == 'full'
        name: Validate Compose required backend settings
        run: |
          ruff check scripts/check_compose_settings.py
          python scripts/check_compose_settings.py
      - if: steps.depth.outputs.mode == 'full'
        name: Provision least-privilege dcim_app role and database
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE ROLE dcim_app LOGIN PASSWORD 'dcim_dev_password';"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE DATABASE dcim_test;"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            "GRANT CREATE, USAGE ON SCHEMA public TO dcim_app;"
      - if: steps.depth.outputs.mode == 'full'
        name: Enable required Postgres extensions
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS btree_gist;'
      - if: steps.depth.outputs.mode == 'full'
        name: Alembic single-head gate
        run: |
          ruff check scripts/check_alembic_single_head.py
          python scripts/check_alembic_single_head.py
      - if: steps.depth.outputs.mode == 'full'
        name: Lint (ruff)
        run: ruff check app tests
      - if: steps.depth.outputs.mode == 'full'
        name: Type check (mypy)
        run: mypy app
      - if: steps.depth.outputs.mode == 'full'
        name: Run migrations
        run: alembic upgrade head
      - if: steps.depth.outputs.mode == 'full'
        name: Validate retention migration round trip
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic downgrade 0010_mvp_alarms
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - if: steps.depth.outputs.mode == 'full'
        name: Bootstrap privileged retention role
        run: PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -f scripts/bootstrap_privileged_roles.sql
      - if: steps.depth.outputs.mode == 'full'
        name: Grant CAP_NET_RAW for the ICMP driver's real raw-socket tests
        run: sudo setcap cap_net_raw+ep "$(readlink -f "$(command -v python3)")"
      - if: steps.depth.outputs.mode == 'full'
        name: Run PostgreSQL retention hostile validation
        run: pytest -q tests/integration/test_mvp_retention_hostile.py
      - if: steps.depth.outputs.mode == 'full'
        name: Validate extraction apply against PostgreSQL
        run: pytest -q tests/api/test_catalog_extraction_apply.py tests/unit/test_catalog_apply_conversion.py
      - if: steps.depth.outputs.mode == 'full'
        name: Run regression tests
        run: pytest -q --ignore=tests/integration/test_mvp_retention_hostile.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Intentionally no `needs: fast-ci`: the required `frontend` check must
    # complete on every PR independently, so it can never be skipped as a side
    # effect of Fast CI (safeguard #2). Frontend is already fast (~2 minutes).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Cache Node dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: npm-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-frontend-${{ runner.os }}-
      - run: npm ci
      - name: Audit for high/critical vulnerabilities (fails build)
        run: npm audit --audit-level=high
      - name: Full audit report (moderate and above, non-blocking)
        if: always()
        run: npm audit --audit-level=moderate || true
      - name: Run frontend unit tests (Vitest)
        run: npm test
      - run: npm run typecheck
      - run: npx eslint . --ext ts,tsx
      - run: npm run build

  # =========================================================================
  # COMPONENT CI — affected components only.
  # Each job runs only when its component is touched by the change, and never
  # when Full CI is already covering everything.
  # =========================================================================
  component-edge-collector:
    name: Component CI — Edge Collector
    needs: fast-ci
    if: >-
      needs.fast-ci.result == 'success' &&
      needs.fast-ci.outputs.run-edge-collector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install Edge Collector test dependencies
        run: pip install "./edge_collector[test]"
      - name: Lint (ruff)
        run: ruff check edge_collector
      - name: Run Edge Collector tests
        # tests/test_snmp.py binds a real UDP socket on 127.0.0.1 and speaks real
        # BER to the collector; no privileges, hardware or external network needed.
        run: pytest -q edge_collector/tests
      - name: Run Edge Collector SNMPv3 interoperability
        # Real Edge Collector SNMPv3 stack against an independent implementation
        # (pysnmp) over loopback. No privileges, hardware or external network.
        run: |
          pip install -r edge_collector/interop/requirements.txt
          python -m edge_collector.interop.run_interop --json interop-results.json

  component-database-contracts:
    name: Component CI — Database & shared contracts
    needs: fast-ci
    if: >-
      needs.fast-ci.result == 'success' &&
      needs.fast-ci.outputs.run-database-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install backend for contract checks
        run: pip install -e "./backend"
      - name: Migration integrity (Alembic single-head gate)
        run: |
          ruff check backend/scripts/check_alembic_single_head.py
          python backend/scripts/check_alembic_single_head.py
      - name: Validate Compose required backend settings
        run: |
          ruff check backend/scripts/check_compose_settings.py
          python backend/scripts/check_compose_settings.py

  component-opencode:
    name: Component CI — OpenCode
    needs: fast-ci
    if: >-
      needs.fast-ci.result == 'success' &&
      needs.fast-ci.outputs.run-opencode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Validate CI policy/router scripts compile
        run: python -m py_compile .github/scripts/ci_policy.py .github/scripts/ci_router.py
      - name: Confirm the CI policy shape
        run: |
          python - <<'PY'
          import ci_policy
          assert ci_policy.required_checks() == ("backend", "frontend")
          assert "backend" in ci_policy.all_components()
          assert "frontend" in ci_policy.all_components()
          print("CI policy shape OK")
          PY

  # =========================================================================
  # FULL CI — high-risk changes only.
  # Triggers for security, authentication, migrations, infrastructure, workflow
  # configuration and shared dependencies. Complete Python compatibility matrix,
  # PostgreSQL/Redis integration, Docker Compose, Playwright E2E, deployment
  # tooling regressions, relevant security validation.
  # =========================================================================
  full-ci:
    name: Full CI (high-risk change)
    needs: fast-ci
    if: >-
      needs.fast-ci.result == 'success' &&
      (
        needs.fast-ci.outputs.run-full-ci == 'true' ||
        needs.fast-ci.outputs.detection-failed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dcim_dev_superuser_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ${{ env.JWT_SECRET_KEY }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ env.CREDENTIAL_ENCRYPTION_KEY }}
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:dcim_dev_superuser_password@localhost:5432/dcim_test
      PGPASSWORD_SUPERUSER: dcim_dev_superuser_password
      REQUIRE_REAL_OCR: "1"
      # E2E administrator fixture password (non-secret test fixture, deliberate plaintext;
      # never a production secret and never stored as one).
      E2E_ADMIN_PASSWORD: E2ePassw0rd!
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Report the resolved interpreter
        run: python -VV
      - name: Cache Python dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: pip-full-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            pip-full-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        # The first place an unsupported runtime shows up: a dependency with no
        # wheel and no buildable sdist for this interpreter fails here.
        run: pip install -e ".[dev]"
      - name: Install the Edge Collector runtime for contract tests
        run: pip install "./edge_collector[test]"
      - name: Install the OCR engine for the real-OCR extraction tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: Migration integrity (Alembic single-head gate)
        run: |
          ruff check scripts/check_alembic_single_head.py
          python scripts/check_alembic_single_head.py
      - name: Provision least-privilege dcim_app role and database
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE ROLE dcim_app LOGIN PASSWORD 'dcim_dev_password';"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE DATABASE dcim_test;"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            "GRANT CREATE, USAGE ON SCHEMA public TO dcim_app;"
      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS btree_gist;'
      - name: Run migrations and validate round trip
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          alembic downgrade 0010_mvp_alarms
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - name: Bootstrap privileged retention role
        run: PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -f scripts/bootstrap_privileged_roles.sql
      - name: Grant CAP_NET_RAW for the ICMP driver's real raw-socket tests
        run: sudo setcap cap_net_raw+ep "$(readlink -f "$(command -v python3)")"
      - name: Run PostgreSQL retention hostile validation
        run: pytest -q tests/integration/test_mvp_retention_hostile.py
      - name: Validate extraction apply against PostgreSQL
        run: pytest -q tests/api/test_catalog_extraction_apply.py tests/unit/test_catalog_apply_conversion.py
      - name: Run backend regression tests
        run: pytest -q --ignore=tests/integration/test_mvp_retention_hostile.py
      - name: Run Edge Collector tests on this runtime
        working-directory: ${{ github.workspace }}
        run: pytest -q edge_collector/tests
      - name: Validate Compose required backend settings (Full CI)
        run: |
          ruff check scripts/check_compose_settings.py
          python scripts/check_compose_settings.py
      - name: Check combined production Compose configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests and typecheck (Full CI)
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
      - name: Start backend, Celery and frontend dev servers for E2E
        # Runs once (Python 3.12 matrix variant). Mirrors the browser-e2e job: a real
        # backend on 8000, a real Celery worker on Redis, and the Vite dev server on 5173,
        # all against the provisioned dcim_test database, so Playwright exercises genuine
        # HTTP + database + broker paths rather than stubs.
        if: matrix.python-version == '3.12'
        run: |
          set -e
          # Seed a deterministic E2E administrator fixture into the provisioned database.
          python scripts/create_admin.py \
            --email e2e-admin@example.com \
            --name "E2E Administrator" \
            --password-from-env E2E_ADMIN_PASSWORD \
            --if-exists skip || true
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend.pid"
          nohup celery -A app.infrastructure.celery_app worker --loglevel=info -Q default,maintenance,extraction,reports,notifications \
            > "$GITHUB_WORKSPACE/celery-worker.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/celery-worker.pid"
          cd "$GITHUB_WORKSPACE/frontend"
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/frontend.pid"
          cd "$GITHUB_WORKSPACE"
      - name: Wait for backend and frontend readiness
        if: matrix.python-version == '3.12'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/api/v1/health/ready > /tmp/ready.json; then
              echo "backend ready after ${attempt}s"
              break
            fi
            sleep 1
          done
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:5173/ > /dev/null; then
              echo "frontend ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::servers did not become ready"; cat "$GITHUB_WORKSPACE/backend.log" "$GITHUB_WORKSPACE/frontend.log" 2>/dev/null || true; exit 1
      - name: Run Playwright browser E2E (Full CI)
        if: matrix.python-version == '3.12'
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
          BASE_URL: http://127.0.0.1:5173
          DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
          REDIS_URL: redis://localhost:6379/1
        run: npm run test:e2e
      - name: Collect E2E failure artifacts
        if: matrix.python-version == '3.12' && failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-artifacts"
          cp "$GITHUB_WORKSPACE/backend.log" "$GITHUB_WORKSPACE/e2e-artifacts/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/frontend.log" "$GITHUB_WORKSPACE/e2e-artifacts/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/celery-worker.log" "$GITHUB_WORKSPACE/e2e-artifacts/" 2>/dev/null || true
          if [ -d frontend/test-results ]; then
            cp -r frontend/test-results "$GITHUB_WORKSPACE/e2e-artifacts/playwright-test-results"
          fi
          echo "collected:"; find "$GITHUB_WORKSPACE/e2e-artifacts" -type f 2>/dev/null | head -50 || true
      - name: Upload E2E failure artifacts
        if: matrix.python-version == '3.12' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: full-ci-browser-e2e-failure-artifacts
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop E2E servers
        if: matrix.python-version == '3.12' && always()
        run: |
          for pidfile in backend.pid frontend.pid celery-worker.pid; do
            if [ -f "$GITHUB_WORKSPACE/$pidfile" ]; then
              kill "$(cat "$GITHUB_WORKSPACE/$pidfile")" 2>/dev/null || true
            fi
          done
      - name: Deployment tooling regressions (Full CI)
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          python3 tests/deployment/check_workflows.py
          python3 -m unittest discover -s tests/deployment -p 'test_*.py' -v
