name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # NOTE (Finding C1 / PHASE1_CORRECTION_REPORT.md): the bootstrap superuser here is
      # `postgres`, NOT `dcim_app`. Previously POSTGRES_USER was set to `dcim_app`, which
      # the official postgres image grants full superuser rights to — silently defeating
      # every least-privilege control this CI job is supposed to validate, since a
      # superuser bypasses all GRANT/REVOKE/ownership checks. `dcim_app` is now created
      # explicitly, as an ordinary role, by the "Provision least-privilege dcim_app role"
      # step below — matching README.md's non-Docker local setup.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dcim_dev_superuser_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-use-32ch
      CREDENTIAL_ENCRYPTION_KEY: eHTZ8u6qF3v2N1oQwL9pR7sT4yU6iO0aB2cD5eF8gH0=
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:dcim_dev_superuser_password@localhost:5432/dcim_test
      ENVIRONMENT: test
      PGPASSWORD_SUPERUSER: dcim_dev_superuser_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Provision least-privilege dcim_app role and database
        # dcim_app is deliberately NOT the database owner — see the note on the postgres
        # service above. PostgreSQL grants the database owner an implicit DROP TABLE right
        # over every table in that database regardless of individual table ownership,
        # which would otherwise silently bypass audit_log's ownership transfer to
        # dcim_retention_admin (Finding C1 correction). dcim_test stays owned by the
        # `postgres` superuser; dcim_app gets exactly CREATE, USAGE on the public schema.
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE ROLE dcim_app LOGIN PASSWORD 'dcim_dev_password';"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d postgres -c \
            "CREATE DATABASE dcim_test;"
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            "GRANT CREATE, USAGE ON SCHEMA public TO dcim_app;"
      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -c \
            'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS btree_gist;'
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Run migrations
        run: alembic upgrade head
      - name: Validate retention migration round trip
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic downgrade 0010_mvp_alarms
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - name: Bootstrap privileged retention role
        run: PGPASSWORD=$PGPASSWORD_SUPERUSER psql -h localhost -U postgres -d dcim_test -f scripts/bootstrap_privileged_roles.sql
      - name: Grant CAP_NET_RAW for the ICMP driver's real raw-socket tests
        # app/application/drivers/icmp.py opens a genuine SOCK_RAW/IPPROTO_ICMP socket
        # (documented there as a real operational requirement, not silently assumed) --
        # the runner's default non-root user cannot do that without this capability, so
        # tests/unit/test_drivers.py and the collector poll-now tests would otherwise
        # fail with PermissionError on every run, regardless of this PR's own changes.
        run: sudo setcap cap_net_raw+ep "$(readlink -f "$(command -v python3)")"
      - name: Run PostgreSQL retention hostile validation
        run: pytest -q tests/integration/test_mvp_retention_hostile.py
      - name: Run regression tests
        run: pytest -q --ignore=tests/integration/test_mvp_retention_hostile.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npx eslint . --ext ts,tsx
      - run: npm run build
