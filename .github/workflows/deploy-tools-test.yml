name: Deployment Tools Test

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
    paths:
      - '.github/scripts/verify_release_sha.py'
      - '.github/scripts/opencode_*.py'
      - '.github/opencode/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'scripts/deploy-docker-compose.sh'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - '.github/workflows/deployment-validation.yml'
      - '.github/scripts/compose_smoke.py'
      - '.github/scripts/clamd_probe.py'
      - '.github/scripts/ocr_sandbox_probe.py'
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/alembic.ini'
      - 'backend/migrations/**'
      - 'backend/scripts/bootstrap_privileged_roles.sql'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'tests/deployment/**'
  pull_request:
    paths:
      - '.github/scripts/verify_release_sha.py'
      - '.github/scripts/opencode_*.py'
      - '.github/opencode/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'scripts/deploy-docker-compose.sh'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - '.github/workflows/deployment-validation.yml'
      - '.github/scripts/compose_smoke.py'
      - '.github/scripts/clamd_probe.py'
      - '.github/scripts/ocr_sandbox_probe.py'
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/alembic.ini'
      - 'backend/migrations/**'
      - 'backend/scripts/bootstrap_privileged_roles.sql'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'tests/deployment/**'

permissions: {}

jobs:
  deployment-tooling:
    name: Deployment tooling regressions
    # A GitHub-hosted VM, discarded after the job: the privileged OpenCode tests create an account, root-owned
    # trees and mounts here and never clean them up (docs/security/OPENCODE_AGENT_AUTHORITY.md, Validation).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Check workflow syntax and security
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/deploy-docker-compose.sh
          python3 -m pip install PyYAML==6.0.2
          python3 tests/deployment/check_workflows.py
      - name: Prepare the disposable runner and the pinned OpenCode binary
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${RUNNER_KIND}" = "github-hosted"
          sudo -n true
          sudo apt-get install -y acl
          (cd .github/opencode/runtime && npm ci --ignore-scripts --no-audit --no-fund)
          .github/opencode/runtime/node_modules/opencode-linux-x64/bin/opencode --version
      - name: Run the deployment tests, privileged OpenCode tests included (any skip fails)
        env:
          OPENCODE_DISPOSABLE_HOST: '1'
        run: |
          set -euo pipefail
          python3 tests/deployment/opencode_validation/suite.py run --pattern 'test_*.py' --out deployment-tests.json
          python3 tests/deployment/opencode_validation/suite.py check-ci deployment-tests.json
      - name: Verify read-only artifact upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: validated-workflows
          path: .github/workflows/*.yml
          if-no-files-found: error
          retention-days: 1
      - name: Check combined production Compose configuration
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          DCIM_APP_PASSWORD: disposable-ci-app-password
          JWT_SECRET_KEY: disposable-ci-jwt-key-only
          CREDENTIAL_ENCRYPTION_KEY: dGVzdC1vbmx5LWRpc3Bvc2FibGUtMzItYnl0ZS1rZXkhISE=
          POSTGRES_DATA_PATH: /tmp/dcim-disposable-postgres
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          python3 tests/deployment/check_compose.py

  combined-staging:
    name: Disposable combined-stack startup and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require real Docker Engine and Compose
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker compose version
      - name: Run isolated combined-stack and recovery cases
        run: |
          set -euo pipefail
          python3 tests/deployment/real_compose_validation.py
