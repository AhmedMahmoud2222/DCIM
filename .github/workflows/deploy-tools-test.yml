name: Deployment Tools Test

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
    paths:
      - '.github/scripts/verify_release_sha.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-tools-test.yml'
      - 'scripts/deploy-docker-compose.sh'
      - 'docker-compose.production.yml'
      - 'tests/deployment/**'
  pull_request:
    paths:
      - '.github/scripts/verify_release_sha.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-tools-test.yml'
      - 'scripts/deploy-docker-compose.sh'
      - 'docker-compose.production.yml'
      - 'tests/deployment/**'

permissions:
  contents: read

jobs:
  deployment-tooling:
    name: Deployment tooling regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Check workflow syntax and security
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/deploy-docker-compose.sh
          python3 tests/deployment/check_workflows.py
      - name: Run mocked API, lock and rollback tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/deployment -p 'test_*.py' -v
      - name: Check combined production Compose configuration
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          DCIM_APP_PASSWORD: disposable-ci-app-password
          JWT_SECRET_KEY: disposable-ci-jwt-key-only
          CREDENTIAL_ENCRYPTION_KEY: dGVzdC1vbmx5LWRpc3Bvc2FibGUtMzItYnl0ZS1rZXkhISE=
          POSTGRES_DATA_PATH: /tmp/dcim-disposable-postgres
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          python3 tests/deployment/check_compose.py
