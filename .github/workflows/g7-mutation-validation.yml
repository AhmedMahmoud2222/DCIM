name: G7 mutation validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "G7 baseline SHA"
        required: true
        default: "d2039f6b5d1f8b52ffa5a58754b46ff3f6b1a675"
  pull_request:
    paths:
      - '.github/workflows/g7-mutation-validation.yml'

jobs:
  g7-mutation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_admin_password
          POSTGRES_DB: dcim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dcim_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres_test_admin_password@localhost:5432/dcim_test
      JWT_SECRET_KEY: test-only-secret-key-not-for-production-use-32ch
      CREDENTIAL_ENCRYPTION_KEY: eHTZ8u6qF3v2N1oQwL9pR7sT4yU6iO0aB2cD5eF8gH0=
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || 'd2039f6b5d1f8b52ffa5a58754b46ff3f6b1a675' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
      - name: Provision extensions and roles
        run: |
          export PGPASSWORD=postgres_test_admin_password
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -h localhost -U postgres -d dcim_test -c "CREATE ROLE dcim_app WITH LOGIN PASSWORD 'dcim_dev_password';" || true
          psql -h localhost -U postgres -d dcim_test -c "GRANT CREATE, USAGE ON SCHEMA public TO dcim_app;"
          psql -h localhost -U postgres -d dcim_test -c "GRANT ALL PRIVILEGES ON DATABASE dcim_test TO dcim_app;"
      - name: Alembic single-head and migrate
        run: |
          cd backend
          python -m alembic heads
          python -m alembic upgrade head
      - name: Baseline parity (must pass)
        run: |
          cd backend
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
      - name: M1 remove revision guard (must fail)
        run: |
          cd backend
          cp app/api/v1/telemetry.py /tmp/telemetry.py.bak
          python - <<'PY'
          import re
          p = "app/api/v1/telemetry.py"
          s = open(p).read()
          # M1: remove the recorded-revision guard so evidence alone drives status.
          s2 = re.sub(r"TelemetryReading\.mapping_revision_id\.is_not\(None\)\s*\)\s*,\s*", "", s, count=1)
          assert s2 != s, "M1 mutation did not apply"
          open(p, "w").write(s2)
          PY
          set +e
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
          code=$?
          cp /tmp/telemetry.py.bak app/api/v1/telemetry.py
          echo "M1_EXIT=$code"
          if [ "$code" -eq 0 ]; then echo "M1 SURVIVED"; exit 1; fi
          echo "M1 DETECTED"
      - name: M2 swap inferred classification (must fail)
        run: |
          cd backend
          cp app/api/v1/telemetry.py /tmp/telemetry.py.bak
          python - <<'PY'
          p = "app/api/v1/telemetry.py"
          s = open(p).read()
          s2 = s.replace('"inferred_single_revision": "inferred"', '"inferred_single_revision": "pinned"')
          assert s2 != s, "M2 mutation did not apply"
          open(p, "w").write(s2)
          PY
          set +e
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
          code=$?
          cp /tmp/telemetry.py.bak app/api/v1/telemetry.py
          echo "M2_EXIT=$code"
          if [ "$code" -eq 0 ]; then echo "M2 SURVIVED"; exit 1; fi
          echo "M2 DETECTED"
      - name: M3 remove registry-null branch (must fail)
        run: |
          cd backend
          cp app/api/v1/telemetry.py /tmp/telemetry.py.bak
          python - <<'PY'
          p = "app/api/v1/telemetry.py"
          s = open(p).read()
          s2 = s.replace('"unverified_legacy"', '"unverified_registry"')
          assert s2 != s, "M3 mutation did not apply"
          open(p, "w").write(s2)
          PY
          set +e
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
          code=$?
          cp /tmp/telemetry.py.bak app/api/v1/telemetry.py
          echo "M3_EXIT=$code"
          if [ "$code" -eq 0 ]; then echo "M3 SURVIVED"; exit 1; fi
          echo "M3 DETECTED"
      - name: M4 change fallback classification (must fail)
        run: |
          cd backend
          cp app/api/v1/telemetry.py /tmp/telemetry.py.bak
          python - <<'PY'
          p = "app/api/v1/telemetry.py"
          s = open(p).read()
          s2 = s.replace('"unverified_registry"', '"unverified_legacy"')
          assert s2 != s, "M4 mutation did not apply"
          open(p, "w").write(s2)
          PY
          set +e
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
          code=$?
          cp /tmp/telemetry.py.bak app/api/v1/telemetry.py
          echo "M4_EXIT=$code"
          if [ "$code" -eq 0 ]; then echo "M4 SURVIVED"; exit 1; fi
          echo "M4 DETECTED"
      - name: Restore verification (baseline passes again)
        run: |
          cd backend
          git diff --stat
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q
