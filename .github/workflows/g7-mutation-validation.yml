name: G7 mutation validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "G7 baseline SHA"
        required: true
        default: "d2039f6b5d1f8b52ffa5a58754b46ff3f6b1a675"
  pull_request:
    paths:
      - '.github/workflows/g7-mutation-validation.yml'
      - '.github/g7_mutation_runner.py'

jobs:
  g7-mutation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_admin_password
          POSTGRES_DB: dcim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dcim_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://dcim_app:dcim_dev_password@localhost:5432/dcim_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres_test_admin_password@localhost:5432/dcim_test
      JWT_SECRET_KEY: test-only-secret-key-not-for-production-use-32ch
      CREDENTIAL_ENCRYPTION_KEY: eHTZ8u6qF3v2N1oQwL9pR7sT4yU6iO0aB2cD5eF8gH0=
      REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Checkout mutation runner (from workflow branch)
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Checkout exact G7 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || 'd2039f6b5d1f8b52ffa5a58754b46ff3f6b1a675' }}
          path: baseline
      - name: Record tested SHA
        id: tested
        run: |
          cd baseline
          echo "tested_sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git rev-parse HEAD > ../tested_sha.txt
          git log -1 --format='%H %G? %s' > ../tested_commit.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./baseline/backend[dev]"
      - name: Provision extensions and roles
        run: |
          export PGPASSWORD=postgres_test_admin_password
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d dcim_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -h localhost -U postgres -d dcim_test -c "CREATE ROLE dcim_app WITH LOGIN PASSWORD 'dcim_dev_password';" || true
          psql -h localhost -U postgres -d dcim_test -c "GRANT CREATE, USAGE ON SCHEMA public TO dcim_app;"
          psql -h localhost -U postgres -d dcim_test -c "GRANT ALL PRIVILEGES ON DATABASE dcim_test TO dcim_app;"
          psql -h localhost -U postgres -d dcim_test -c "SELECT version();" | tee pg_version.txt
      - name: Alembic single-head and migrate
        run: |
          cd baseline/backend
          python -m alembic heads
          python -m alembic upgrade head
      - name: Baseline parity (must pass)
        run: |
          cd baseline/backend
          pytest tests/integration/test_g7_provenance_parity_postgres.py tests/api/test_g7_series_key_boundary.py -q 2>&1 | tee ../../baseline.log
      - name: M1-M4 mutation experiments
        run: |
          cp ../runner/.github/g7_mutation_runner.py ../g7_mutation_runner.py
          cd baseline
          set +e
          overall=0
          for m in m1 m2 m3 m4; do
            python ../g7_mutation_runner.py "$m" 2>&1 | tee "../../${m}.log"
            rc=${PIPESTATUS[0]}
            echo "${m}_exit=$rc" >> ../mutation_results.txt
            echo "${m}_exit=$rc"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          echo "overall=$overall" >> ../mutation_results.txt
          exit $overall
      - name: Final baseline restore verification
        run: |
          cd baseline
          git diff --stat
          test -z "$(git status --porcelain)" || { echo "WORKTREE NOT CLEAN"; exit 1; }
          cd backend
          pytest tests/integration/test_g7_provenance_parity_postgres.py -q 2>&1 | tee ../../final_baseline.log
      - name: Assemble evidence artifact
        if: always()
        run: |
          mkdir -p evidence
          cp tested_sha.txt tested_commit.txt baseline.log final_baseline.log evidence/ 2>/dev/null || true
          cp m1.log m2.log m3.log m4.log evidence/ 2>/dev/null || true
          cp mutation_results.txt pg_version.txt evidence/ 2>/dev/null || true
          cp .github/g7_mutation_runner.py evidence/ 2>/dev/null || cp runner/.github/g7_mutation_runner.py evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-mutation-evidence
          path: evidence/
          if-no-files-found: warn
