# Codacy configuration for DCIM repository
# Ensures SQL analysis uses PostgreSQL dialect for PostgreSQL scripts.
engines:
  sqlfluff:
    enabled: true
    config:
      dialect: postgres
      templater: raw
  pyflakes:
    enabled: true
  # Codacy-specific UnusedCode is a false positive for pytest fixture imports
  # (race is used as a fixture parameter, _scalar is used in test bodies).
  # Scoped to the specific test file only.
file_patterns:
  - pattern: "backend/scripts/*.sql"
    engine: sqlfluff
    config:
      dialect: postgres
  - pattern: "backend/tests/api/test_equipment_instantiation.py"
    engine: pyflakes
    config:
      ignore:
        - F401