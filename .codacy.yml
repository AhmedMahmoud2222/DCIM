---
# Codacy configuration for DCIM repository.
# See https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# The diagnostic below is PostgreSQL (not T-SQL). tsqllint applies SQL Server
# rules and flags PostgreSQL-specific syntax (e.g. schema-qualified
# public.* references) as compatibility errors. Exclude only this file from
# tsqllint so the PostgreSQL diagnostic is not miscategorized, while keeping
# tsqllint enabled for any genuine T-SQL content and all other analysis intact.
engines:
  tsqllint:
    exclude_paths:
      - "backend/scripts/diagnose_port_connection_conflicts.sql"
  # `race` is re-exported in conftest.py solely so pytest fixture discovery can
  # resolve it by name in sibling test modules (tests/api/test_equipment_instantiation.py
  # uses it as a fixture parameter). It is never directly referenced in conftest.py
  # code, so ruff (F401) and pylintpython3 (W0611) report it as an unused import.
  # This is a demonstrated analyzer incompatibility: Codacy's static analyzers do not
  # understand pytest fixtures registered via re-exported imports. Exclude only this
  # file from these two engines; all other analysis (including tsqllint, bandit,
  # safety, duplication) remains fully active on conftest.py and everywhere else.
  ruff:
    exclude_paths:
      - "backend/tests/conftest.py"
  pylintpython3:
    exclude_paths:
      - "backend/tests/conftest.py"
