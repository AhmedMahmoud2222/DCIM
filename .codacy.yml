---
# Codacy configuration for DCIM repository.
# See https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# The diagnostic below is PostgreSQL (not T-SQL). tsqllint applies SQL Server
# rules and flags PostgreSQL-specific syntax (e.g. schema-qualified
# public.* references) as compatibility errors. Exclude only this file from
# tsqllint so the PostgreSQL diagnostic is not miscategorized, while keeping
# tsqllint enabled for any genuine T-SQL content and all other analysis intact.
engines:
  tsqllint:
    exclude_paths:
      - "backend/scripts/diagnose_port_connection_conflicts.sql"
